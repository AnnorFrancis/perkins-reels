<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header class="top">
  <div class="brandrow"><span class="brand" id="brand">Posts</span><button class="todaybtn" id="today" type="button">Today</button></div>
  <div class="dayrow">
    <button class="nav" id="prev" type="button" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dayinfo"><h1 id="dayname">Loading</h1><p id="daysub"></p></div>
    <button class="nav" id="next" type="button" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <nav class="strip" id="strip" aria-label="Pick a day"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">This calendar needs JavaScript switched on.</p></noscript>
<script src="posts.js?v=510fd261"></script>
